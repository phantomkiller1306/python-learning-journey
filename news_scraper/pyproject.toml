[project]
name = "news-scraper"
version = "0.1.0"
description = ""
authors = [{name = "PhantomKiller",email = "phantomkiller1306@gmail.com"}]

readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "tldextract (>=5.3.1,<6.0.0)",
    "requests-cache (>=1.3.2,<2.0.0)",
    "aiohttp (>=3.14.1,<4.0.0)"
]

[tool.poetry.scripts]
news-scraper = "news_scraper.main:main"

[tool.poetry]
packages = [{include = "news_scraper", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
